<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>It's Over 9000</title>
    <link rel="stylesheet" href="calc.css">
  </head>
  <body>
    <form id="calc-form">
      <input type="text" id="left" placeholder="Left number">
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
      </select>
      <input type="text" id="right" placeholder="Right number">
      <input type="submit" value="Try me!">
    </form>
    <script src="calc.js"></script>
  </body>
</html>
