<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        height: 100%;
        table-layout: fixed;
      }
      td {
        border: 1px solid black;
        text-align: center;
      }
      .first {
        background-color: yellowgreen;
      }
      .second {
        background-color: lightsalmon;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="first">First cell</td>
        <td class="second">Second cell</td>
      </tr>
    </table>
  </body>
</html>
