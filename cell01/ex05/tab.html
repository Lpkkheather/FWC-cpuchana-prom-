<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
      table {
        border-collapse: collapse;
      }
      td {
        width: 200px;
        height: 100px;
        border: 1px solid black;
        padding: 10px;
      }
      .first {
        background-color: yellowgreen;
      }
      .second {
        background-color: lightsalmon;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="first">First cell</td>
        <td class="second">Second cell</td>
      </tr>
    </table>
  </body>
</html>
